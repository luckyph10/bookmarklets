<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Bookmarklet Library</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

/* LOGIN */

#loginPage{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.loginCard{
    width:420px;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 20px rgba(0,0,0,.15);
}

.loginCard h2{
    margin-top:0;
    text-align:center;
}

.loginCard input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

.loginCard button{
    width:100%;
    padding:12px;
    background:#1976d2;
    color:#fff;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

/* MAIN */

#mainPage{
    display:none;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.logoutBtn{
    background:#d32f2f;
    color:#fff;
    border:none;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.card{
    background:#fff;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

input,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:10px;
}

textarea{
    resize:vertical;
}

.saveBtn{
    background:#1976d2;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
}

.desc{
    color:#444;
    margin-bottom:10px;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.copyBtn{
    background:#2e7d32;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.editBtn{
    background:#ff9800;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.deleteBtn{
    background:#d32f2f;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.searchBox{
    margin-bottom:20px;
}

.small{
    color:#666;
    font-size:13px;
    margin-top:8px;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

    <div class="loginCard">

        <h2>Lucky Bookmarklet Library</h2>

        <input
            id="username"
            type="text"
            placeholder="Username"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
        >

        <button onclick="login()">
            Login
        </button>

    </div>

</div>

<!-- MAIN -->

<div id="mainPage">

    <div class="header">
        <h1>📚 Bookmarklet Library</h1>

        <button
            class="logoutBtn"
            onclick="logout()"
        >
            Logout
        </button>
    </div>

    <!-- ADD / EDIT -->

    <div class="card">

        <h2>Add / Edit Bookmarklet</h2>

        <input
            id="bmName"
            type="text"
            placeholder="Bookmarklet Name"
        >

        <textarea
            id="bmDesc"
            rows="4"
            placeholder="Description"
        ></textarea>

        <textarea
            id="bmCode"
            rows="8"
            placeholder="Bookmarklet Code"
        ></textarea>

        <button
            class="saveBtn"
            onclick="saveBookmarklet()"
        >
            Save Bookmarklet
        </button>

        <div class="small">
            Example:
            javascript:(()=>{alert('Hello');})();
        </div>

    </div>

    <!-- SEARCH -->

    <input
        id="search"
        class="searchBox"
        type="text"
        placeholder="Search bookmarklets..."
        onkeyup="filterBookmarks()"
    >

    <!-- LIST -->

    <div id="bookmarkletContainer"></div>

</div>

<script>

const ADMIN_USER = "luckyph10";
const ADMIN_PASS = "naturespringph100808";

let editIndex = -1;

/* LOGIN */

function login(){

    const user =
        document.getElementById("username").value.trim();

    const pass =
        document.getElementById("password").value;

    if(
        user === ADMIN_USER &&
        pass === ADMIN_PASS
    ){

        sessionStorage.setItem(
            "adminLoggedIn",
            "yes"
        );

        showMain();

    }else{

        alert(
            "Invalid username or password."
        );
    }
}

function showMain(){

    document.getElementById(
        "loginPage"
    ).style.display = "none";

    document.getElementById(
        "mainPage"
    ).style.display = "block";

    loadBookmarklets();
}

function logout(){

    sessionStorage.removeItem(
        "adminLoggedIn"
    );

    location.reload();
}

if(
    sessionStorage.getItem(
        "adminLoggedIn"
    ) === "yes"
){
    showMain();
}

document
.getElementById("password")
.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){
            login();
        }
    }
);

/* BOOKMARKLETS */

function getBookmarks(){

    return JSON.parse(
        localStorage.getItem(
            "bookmarklets"
        ) || "[]"
    );
}

function saveBookmarks(data){

    localStorage.setItem(
        "bookmarklets",
        JSON.stringify(data)
    );
}

function loadBookmarklets(){

    const container =
        document.getElementById(
            "bookmarkletContainer"
        );

    container.innerHTML = "";

    const list =
        getBookmarks();

    list.forEach((item,index)=>{

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div class="title">
                ${item.name}
            </div>

            <div class="desc">
                ${item.desc}
            </div>

            <div class="actions">

                <button
                    class="copyBtn"
                    onclick="copyBookmarklet(${index})"
                >
                    Copy
                </button>

                <button
                    class="editBtn"
                    onclick="editBookmarklet(${index})"
                >
                    Edit
                </button>

                <button
                    class="deleteBtn"
                    onclick="deleteBookmarklet(${index})"
                >
                    Delete
                </button>

            </div>
        `;

        container.appendChild(card);

    });

}

function saveBookmarklet(){

    const name =
        document.getElementById(
            "bmName"
        ).value.trim();

    const desc =
        document.getElementById(
            "bmDesc"
        ).value.trim();

    const code =
        document.getElementById(
            "bmCode"
        ).value.trim();

    if(!name || !code){

        alert(
            "Name and Code are required."
        );

        return;
    }

    const data = getBookmarks();

    const item = {
        name:name,
        desc:desc,
        code:code
    };

    if(editIndex >= 0){

        data[editIndex] = item;

        editIndex = -1;

    }else{

        data.push(item);
    }

    saveBookmarks(data);

    document.getElementById(
        "bmName"
    ).value = "";

    document.getElementById(
        "bmDesc"
    ).value = "";

    document.getElementById(
        "bmCode"
    ).value = "";

    loadBookmarklets();

    alert("Saved!");
}

function editBookmarklet(index){

    const data =
        getBookmarks();

    const item =
        data[index];

    document.getElementById(
        "bmName"
    ).value = item.name;

    document.getElementById(
        "bmDesc"
    ).value = item.desc;

    document.getElementById(
        "bmCode"
    ).value = item.code;

    editIndex = index;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

function deleteBookmarklet(index){

    if(
        !confirm(
            "Delete this bookmarklet?"
        )
    ){
        return;
    }

    const data =
        getBookmarks();

    data.splice(index,1);

    saveBookmarks(data);

    loadBookmarklets();
}

function copyBookmarklet(index){

    const data =
        getBookmarks();

    navigator.clipboard.writeText(
        data[index].code
    );

    alert(
        "Bookmarklet copied."
    );
}

function filterBookmarks(){

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    document
    .querySelectorAll(
        "#bookmarkletContainer .card"
    )
    .forEach(card=>{

        const text =
            card.textContent.toLowerCase();

        card.style.display =
            text.includes(search)
            ? ""
            : "none";
    });
}

/* DEFAULT BOOKMARKS */

if(
    !localStorage.getItem(
        "bookmarklets"
    )
){

    saveBookmarks([

        {
            name:"WFA Comments",
            desc:"WFA Comment Helper",
            code:"javascript:(()=>{const s=document.createElement('script');s.src='https://luckyph10.github.io/bookmarklets/wfac.js?'+Date.now();document.head.appendChild(s);})();"
        },

        {
            name:"VOB Comments",
            desc:"VOB Comment Helper",
            code:"javascript:(()=>{const s=document.createElement('script');s.src='https://luckyph10.github.io/bookmarklets/vobcml.js?'+Date.now();document.head.appendChild(s);})();"
        }

    ]);
}

</script>

</body>
</html>
