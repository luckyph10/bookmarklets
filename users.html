<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>User Login</title>
<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:20px;
}
.container{
    max-width:400px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}
input{
    width:100%;
    padding:10px;
    margin:8px 0;
    box-sizing:border-box;
}
button{
    width:100%;
    padding:10px;
    background:#0078d4;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="container">
    <h2>Automation Login</h2>

    <input id="username" placeholder="Username">

    <input id="userkey" placeholder="Access Key">

    <button onclick="saveCredentials()">
        Save
    </button>
</div>

<script>
function getDeviceId() {
    let id = localStorage.getItem("fpy_device");

    if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem("fpy_device", id);
    }

    return id;
}

function saveCredentials() {

    const username =
        document.getElementById("username").value.trim();

    const key =
        document.getElementById("userkey").value.trim();

    if (!username || !key) {
        alert("Username and Key are required.");
        return;
    }

    localStorage.setItem("fpy_username", username);
    localStorage.setItem("fpy_key", key);

    alert(
        "Saved Successfully\n\n" +
        "Username: " + username +
        "\nDevice ID: " + getDeviceId()
    );
}
</script>

</body>
</html>
