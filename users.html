<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Automation Access</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:transparent;
    padding:20px;
}

.card{
    width:100%;
    background:rgba(25,25,25,.95);
    border:1px solid rgba(255,255,255,.1);
    border-radius:22px;
    padding:25px;
    box-shadow:0 20px 40px rgba(0,0,0,.45);
}

.logo{
    font-size:40px;
    text-align:center;
    margin-bottom:10px;
}

h2{
    color:#fff;
    text-align:center;
    margin-bottom:5px;
}

.subtitle{
    color:#bdbdbd;
    text-align:center;
    font-size:13px;
    margin-bottom:20px;
}

.device{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    color:#fff;
    padding:12px;
    border-radius:14px;
    margin-bottom:15px;
    font-size:12px;
    word-break:break-all;
}

label{
    display:block;
    color:#ddd;
    margin-bottom:6px;
    font-size:13px;
}

input{
    width:100%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    color:#fff;
    padding:14px;
    border-radius:999px;
    margin-bottom:15px;
}

input::placeholder{
    color:#aaa;
}

input:focus{
    outline:none;
    border-color:#3498ff;
    box-shadow:0 0 15px rgba(52,152,255,.35);
}

.save-btn{
    width:100%;
    border:none;
    padding:14px;
    border-radius:999px;
    background:linear-gradient(
        135deg,
        #0078d4,
        #0099ff
    );
    color:#fff;
    cursor:pointer;
    font-weight:600;
}

.note{
    margin-top:12px;
    text-align:center;
    color:#888;
    font-size:11px;
}

</style>
</head>

<body>

<div class="card">

    <div class="logo">🔐</div>

    <h2>Automation Access</h2>

    <div class="subtitle">
        One-time registration
    </div>

    <div id="device" class="device"></div>

    <label>Username</label>

    <input
        id="username"
        placeholder="Enter Username">

    <label>Access Key</label>

    <input
        id="accessKey"
        type="password"
        placeholder="Enter Access Key">

    <button
        class="save-btn"
        onclick="saveUser()">
        Save & Continue
    </button>

    <div class="note">
        Credentials will be saved locally.
    </div>

</div>

<script>

function getDeviceId(){

    let id =
        localStorage.getItem("fpy_device");

    if(!id){

        id = crypto.randomUUID();

        localStorage.setItem(
            "fpy_device",
            id
        );
    }

    return id;
}

document.getElementById("device").innerHTML =
`
<b>Device ID</b><br>
${getDeviceId()}
`;

function saveUser(){

    const username =
        document.getElementById("username")
        .value.trim();

    const accessKey =
        document.getElementById("accessKey")
        .value.trim();

    if(!username || !accessKey){

        alert(
            "Username and Access Key are required."
        );

        return;
    }

    parent.postMessage({
        type:"fpy-auth",
        username:username,
        accessKey:accessKey,
        deviceId:getDeviceId()
    },"*");

}

</script>

</body>
</html>
