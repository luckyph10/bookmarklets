<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Automation Setup</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:rgba(0,0,0,.65);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    position:relative;
    width:420px;
    background:#fff;
    border-radius:16px;
    padding:24px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    animation:popup .25s ease;
}

@keyframes popup{
    from{
        opacity:0;
        transform:scale(.9);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.close-btn{
    position:absolute;
    top:12px;
    right:12px;
    width:32px;
    height:32px;
    border:none;
    background:#f3f4f6;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
    color:#555;
}

.close-btn:hover{
    background:#e5e7eb;
}

h2{
    text-align:center;
    margin-bottom:15px;
    color:#222;
}

.subtitle{
    text-align:center;
    font-size:13px;
    color:#666;
    margin-bottom:20px;
}

.device{
    background:#f5f7fa;
    border:1px solid #e3e8ef;
    border-radius:8px;
    padding:10px;
    margin-bottom:15px;
    font-size:12px;
    word-break:break-word;
}

label{
    display:block;
    margin-bottom:5px;
    font-size:13px;
    color:#555;
}

input{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:15px;
}

input:focus{
    outline:none;
    border-color:#0078d4;
}

.save-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#0078d4;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.save-btn:hover{
    background:#0069bd;
}

.footer{
    margin-top:10px;
    text-align:center;
    color:#777;
    font-size:12px;
}

</style>
</head>

<body>

<div class="card">

    <button class="close-btn" onclick="window.close()">×</button>

    <h2>Automation Registration</h2>

    <div class="subtitle">
        Enter your assigned credentials
    </div>

    <div id="device" class="device"></div>

    <label>Username</label>
    <input
        id="username"
        type="text"
        placeholder="Enter username">

    <label>Access Key</label>
    <input
        id="accessKey"
        type="password"
        placeholder="Enter access key">

    <button
        class="save-btn"
        onclick="saveUser()">
        Save & Continue
    </button>

    <div class="footer">
        One-time setup only
    </div>

</div>

<script>

function getDeviceId(){

    let id = localStorage.getItem("fpy_device");

    if(!id){

        id = crypto.randomUUID();

        localStorage.setItem(
            "fpy_device",
            id
        );
    }

    return id;
}

document.getElementById("device").innerHTML =
`
<b>Device ID</b><br>
${getDeviceId()}
`;

function saveUser(){

    const username =
        document.getElementById("username")
        .value.trim();

    const accessKey =
        document.getElementById("accessKey")
        .value.trim();

    if(!username || !accessKey){

        alert(
            "Username and Access Key are required."
        );

        return;
    }

    localStorage.setItem(
        "fpy_username",
        username
    );

    localStorage.setItem(
        "fpy_key",
        accessKey
    );

    alert(
        "Registration completed successfully."
    );

    window.close();
}

</script>

</body>
</html>
