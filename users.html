<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Automation Setup</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:350px;
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

h2{
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#0078d4;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.device{
    background:#f0f0f0;
    padding:8px;
    border-radius:6px;
    margin-bottom:10px;
    word-break:break-all;
    font-size:12px;
}

</style>

</head>

<body>

<div class="card">

<h2>Automation Registration</h2>

<div id="device" class="device"></div>

<input
id="username"
placeholder="Username">

<input
id="accessKey"
placeholder="Access Key">

<button onclick="saveUser()">
Save & Continue
</button>

</div>

<script>

function getDeviceId(){

    let id =
        localStorage.getItem("fpy_device");

    if(!id){

        id = crypto.randomUUID();

        localStorage.setItem(
            "fpy_device",
            id
        );
    }

    return id;
}

document.getElementById("device").innerHTML =
    "<b>Device ID:</b><br>" +
    getDeviceId();

function saveUser(){

    const username =
        document.getElementById("username")
        .value.trim();

    const accessKey =
        document.getElementById("accessKey")
        .value.trim();

    if(!username || !accessKey){

        alert(
            "Username and Access Key are required."
        );

        return;
    }

    localStorage.setItem(
        "fpy_username",
        username
    );

    localStorage.setItem(
        "fpy_key",
        accessKey
    );

    alert(
        "Registration completed successfully."
    );

    window.close();
}

</script>

</body>
</html>
