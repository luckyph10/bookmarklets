<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Automation Login</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:white;
    padding:30px;
    border-radius:10px;
    width:350px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

input{
    width:100%;
    margin-bottom:10px;
    padding:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    background:#0078d4;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<h2>User Setup</h2>

<input id="username" placeholder="Username">

<input id="accessKey" placeholder="Access Key">

<button onclick="saveLogin()">
Save
</button>

</div>

<script>

function saveLogin(){

    const username =
        document.getElementById("username").value.trim();

    const key =
        document.getElementById("accessKey").value.trim();

    if(!username || !key){
        alert("Username and Access Key are required.");
        return;
    }

    localStorage.setItem("fpy_username", username);
    localStorage.setItem("fpy_key", key);

    alert("Credentials saved successfully.");

    window.close();
}

</script>

</body>
</html>
