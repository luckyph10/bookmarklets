<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Automation Access</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:rgba(0,0,0,.75);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* Popup Card */

.card{
    width:420px;
    max-width:100%;
    background:rgba(25,25,25,.95);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:22px;
    padding:25px;
    box-shadow:
        0 20px 40px rgba(0,0,0,.45),
        0 0 20px rgba(0,120,255,.15);
    position:relative;
}

/* Close Button */

.close-btn{
    position:absolute;
    top:12px;
    right:12px;
    width:35px;
    height:35px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    color:#fff;
    cursor:pointer;
    font-size:18px;
}

.close-btn:hover{
    background:rgba(255,255,255,.18);
}

/* Header */

.logo{
    text-align:center;
    font-size:42px;
    margin-bottom:10px;
}

h2{
    color:#fff;
    text-align:center;
    margin-bottom:5px;
}

.subtitle{
    color:#bdbdbd;
    text-align:center;
    font-size:13px;
    margin-bottom:20px;
}

/* Device Box */

.device{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    color:#fff;
    padding:12px;
    border-radius:14px;
    margin-bottom:15px;
    font-size:12px;
    word-break:break-all;
}

/* Labels */

label{
    display:block;
    color:#ddd;
    margin-bottom:6px;
    font-size:13px;
}

/* Bubble Inputs */

input{
    width:100%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    color:#fff;
    padding:14px 16px;
    border-radius:999px;
    margin-bottom:15px;
    font-size:14px;
}

input::placeholder{
    color:#aaa;
}

input:focus{
    outline:none;
    border-color:#3498ff;
    box-shadow:0 0 15px rgba(52,152,255,.35);
}

/* Button */

.save-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:999px;
    background:linear-gradient(
        135deg,
        #0078d4,
        #0099ff
    );
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}

.save-btn:hover{
    opacity:.9;
}

.note{
    margin-top:12px;
    text-align:center;
    color:#999;
    font-size:11px;
}

</style>
</head>

<body>

<div class="card">

    <button
        class="close-btn"
        onclick="window.close()">
        ✕
    </button>

    <div class="logo">🔐</div>

    <h2>Automation Access</h2>

    <div class="subtitle">
        One-time registration only
    </div>

    <div
        id="device"
        class="device">
    </div>

    <label>Username</label>

    <input
        id="username"
        placeholder="Enter Username">

    <label>Access Key</label>

    <input
        id="accessKey"
        type="password"
        placeholder="Enter Access Key">

    <button
        class="save-btn"
        onclick="saveUser()">
        Save & Continue
    </button>

    <div class="note">
        Credentials are saved locally on this browser.
    </div>

</div>

<script>

function getDeviceId(){

    let id = localStorage.getItem("fpy_device");

    if(!id){

        id = crypto.randomUUID();

        localStorage.setItem(
            "fpy_device",
            id
        );
    }

    return id;
}

document.getElementById("device").innerHTML = `
<b>Device ID</b><br>
${getDeviceId()}
`;

function saveUser(){

    const username =
        document.getElementById("username")
        .value.trim();

    const accessKey =
        document.getElementById("accessKey")
        .value.trim();

    if(!username || !accessKey){

        alert(
            "Username and Access Key are required."
        );

        return;
    }

    parent.postMessage({
        type: "fpy-auth",
        username: username,
        accessKey: accessKey,
        deviceId: getDeviceId()
    },"*");
}

</script>
