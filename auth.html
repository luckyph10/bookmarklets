<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Automation Registration</title>

</head>

<body>

    <h1>Register</h1>

    <input
        id="username"
        type="text"
        placeholder="Username"
    >

    <button id="register">
        Register
    </button>

    <div id="message"></div>


    <script>

        const API =
            'https://YOUR-BACKEND-URL.workers.dev';


        document
            .getElementById('register')
            .onclick = async () => {

                const username =
                    document
                        .getElementById('username')
                        .value
                        .trim();

                if (!username) {

                    document
                        .getElementById('message')
                        .textContent =
                            'Enter a username.';

                    return;
                }


                try {

                    const response =
                        await fetch(
                            API + '/register',
                            {
                                method: 'POST',

                                headers: {
                                    'Content-Type':
                                        'application/json'
                                },

                                body: JSON.stringify({
                                    name: username
                                })
                            }
                        );


                    const result =
                        await response.json();


                    if (!result.success) {

                        document
                            .getElementById('message')
                            .textContent =
                                result.error;

                        return;
                    }


                    document
                        .getElementById('message')
                        .textContent =
                            'Registration successful.';

                } catch (error) {

                    document
                        .getElementById('message')
                        .textContent =
                            'Server connection failed.';

                }

            };

    </script>

</body>

</html>
