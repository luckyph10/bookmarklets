<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky Bookmarklets - Login</title>

<script>
if (sessionStorage.getItem('adminLoggedIn') === 'yes') {
    window.location.href = 'index.html';
}
</script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f3f6fb;
    font-family:Arial,sans-serif;
}

.login-card{
    width:400px;
    max-width:95%;
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    font-size:15px;
    font-weight:bold;
    background:#1976d2;
    color:#fff;
    cursor:pointer;
}

button:hover{
    background:#1565c0;
}

.error{
    margin-top:10px;
    color:#d32f2f;
    text-align:center;
    display:none;
    font-weight:bold;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:#888;
    font-size:13px;
}

</style>
</head>
<body>

<div class="login-card">

    <div class="logo">
        Bookmarklets
    </div>

    <div class="subtitle">
        Admin Login
    </div>

    <input
        id="username"
        type="text"
        placeholder="Username"
        autocomplete="off"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <button onclick="login()">
        Login
    </button>

    <div id="error" class="error">
        Invalid username or password.
    </div>

    <div class="footer">
        Lucky Bookmarklet Library
    </div>

</div>

<script>

const ADMIN_USER = "luckyph10";
const ADMIN_PASS = "naturespringph100808";

function login(){

    const user =
        document
        .getElementById("username")
        .value
        .trim();

    const pass =
        document
        .getElementById("password")
        .value;

    const error =
        document.getElementById("error");

    if(
        user === ADMIN_USER &&
        pass === ADMIN_PASS
    ){

        sessionStorage.setItem(
            "adminLoggedIn",
            "yes"
        );

        window.location.href =
            "index.html";

        return;
    }

    error.style.display = "block";
}

document
.getElementById("password")
.addEventListener("keydown",function(e){

    if(e.key==="Enter"){
        login();
    }
});

</script>

</body>
</html>
